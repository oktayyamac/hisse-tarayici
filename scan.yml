name: Tarayici

on:
  schedule:
    # ABD piyasa saatlerini kapsar (UTC), hafta içi her 5 dakika.
    # Piyasa kapalıysa script hemen çıkar.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Test modu (Telegram'a deneme mesajı gönderir)"
        type: boolean
        default: false

concurrency:
  group: tarayici
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Önceki durumu geri yükle
        uses: actions/cache@v4
        with:
          path: |
            avg_cache.json
            alerted.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Tara
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RVOL_MIN: ${{ vars.RVOL_MIN }}
          CHANGE_MIN: ${{ vars.CHANGE_MIN }}
          PRICE_MIN: ${{ vars.PRICE_MIN }}
          PRICE_MAX: ${{ vars.PRICE_MAX }}
          MIN_AVG_VOL: ${{ vars.MIN_AVG_VOL }}
          MIN_DAY_VOL: ${{ vars.MIN_DAY_VOL }}
        run: python3 scanner.py ${{ inputs.test && '--test' || '--once' }}
