name: Formasyon Testi

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Kaç gün geriye test edilsin"
        default: "120"

jobs:
  flagtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Formasyon testi
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_MIN: ${{ vars.PRICE_MIN }}
          PRICE_MAX: ${{ vars.PRICE_MAX }}
          MIN_AVG_VOL: ${{ vars.MIN_AVG_VOL }}
          MIN_DAY_VOL: ${{ vars.MIN_DAY_VOL }}
          BT_DAYS: ${{ inputs.days }}
        run: python3 flag_backtest.py
