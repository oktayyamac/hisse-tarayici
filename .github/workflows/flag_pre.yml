name: Formasyon Tum Seanslar

on:
  schedule:
    # Hafta içi her 5 dakikada bir (dakika 3, 8, 13, ...). New York 04:00-20:00'yi hem kış hem yaz saatinde kapsar.
    # UTC 08:00-23:58 (ET gün içi) ve ertesi UTC günün 00:00-01:58'i (ET akşamı, gün özeti dahil).
    # Script, 04:00-20:00 NY dışında hemen çıkar.
    - cron: "3-58/5 8-23 * * 1-5"
    - cron: "3-58/5 0-1 * * 2-6"
  workflow_dispatch:

concurrency:
  group: formasyon-tum-seanslar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Önceki durumu geri yükle
        uses: actions/cache@v4
        with:
          path: |
            avg_cache.json
            watch_cache.json
            pre_state.json
          key: prestate-${{ github.run_id }}
          restore-keys: prestate-

      - name: Formasyon tara
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRICE_MIN: ${{ vars.PRICE_MIN }}
          PRICE_MAX: ${{ vars.PRICE_MAX }}
          MIN_AVG_VOL: ${{ vars.MIN_AVG_VOL }}
          PRE_WATCH: ${{ vars.WATCHLIST }}
          FLAG_GAIN_MIN: ${{ vars.FLAG_GAIN_MIN }}
        run: python3 flag_pre.py
